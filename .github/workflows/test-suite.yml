name: Test Suite

on:
  push:
    branches: [ main ]
    paths:
      - 'fumitm.py'
      - 'fumitm_windows.py'
      - 'test_suite/**'
      - '.github/workflows/test-suite.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'fumitm.py'
      - 'fumitm_windows.py'
      - 'test_suite/**'
      - '.github/workflows/test-suite.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Detect which files changed to conditionally run platform-specific tests
  changes:
    runs-on: ubuntu-latest
    outputs:
      fumitm: ${{ steps.filter.outputs.fumitm }}
      fumitm_windows: ${{ steps.filter.outputs.fumitm_windows }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        filters: |
          fumitm:
            - 'fumitm.py'
            - '.github/workflows/test-suite.yml'
            - 'test_suite/conftest.py'
            - 'test_suite/test_fumitm_integration.py'
            - 'test_suite/test_netskope_provider.py'
            - 'test_suite/test_suspicious_bundles.py'
            - 'test_suite/test_aikido_root.py'
            - 'test_suite/test_curlrc.py'
            - 'test_suite/test_headless_mdm.py'
            - 'test_suite/helpers.py'
            - 'test_suite/mock_data.py'
          fumitm_windows:
            - 'fumitm_windows.py'
            - '.github/workflows/test-suite.yml'
            - 'test_suite/conftest.py'
            - 'test_suite/test_fumitm_windows.py'
            - 'test_suite/helpers.py'
            - 'test_suite/mock_data.py'

  test-macos:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.fumitm == 'true' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install test dependencies
      working-directory: test_suite
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -r requirements.txt

    - name: Run tests
      working-directory: test_suite
      run: |
        source .venv/bin/activate
        python -m pytest test_fumitm_integration.py test_netskope_provider.py test_suspicious_bundles.py test_aikido_root.py test_curlrc.py test_headless_mdm.py -v --tb=short

  test-linux:
    runs-on: ubuntu-latest
    needs: [changes, test-macos]  # Only run after macOS tests pass
    if: needs.changes.outputs.fumitm == 'true' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install zsh test dependency
      run: |
        sudo apt-get update
        sudo apt-get install --yes zsh

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install test dependencies
      working-directory: test_suite
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -r requirements.txt

    - name: Run tests
      working-directory: test_suite
      run: |
        source .venv/bin/activate
        python -m pytest test_fumitm_integration.py test_netskope_provider.py test_suspicious_bundles.py test_aikido_root.py test_curlrc.py test_headless_mdm.py -v --tb=short

  test-windows:
    runs-on: windows-latest
    needs: [changes, test-macos]  # Only run after macOS tests pass
    # Only run when fumitm_windows.py or its tests change
    if: needs.changes.outputs.fumitm_windows == 'true' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install test dependencies
      working-directory: test_suite
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Windows-specific tests
      working-directory: test_suite
      run: |
        python -m pytest test_fumitm_windows.py -v --tb=short
